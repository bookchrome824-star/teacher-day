<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Цомгийн удирдлага</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <header class="admin-header">
    <div>
      <p>TEACHER DAY • ADMIN</p>
      <h1>Дурсамжийн цомог ♡</h1>
    </div>

    <a href="/" class="home-btn">
      ← Үндсэн сайт
    </a>
  </header>


  <main class="admin-container">

    <section class="admin-card">

      <div class="card-heading">
        <span>01</span>
        <div>
          <p>ШИНЭ ДУРСАМЖ</p>
          <h2>Зураг нэмэх</h2>
        </div>
      </div>


      <form id="uploadForm">

        <div class="form-group">
          <label for="password">
            🔐 Admin нууц үг
          </label>

          <input
            type="password"
            id="password"
            placeholder="Нууц үгээ оруулна уу"
            required
          >
        </div>


        <div class="form-group">
          <label for="category">
            Цомгийн ангилал
          </label>

          <select id="category" required>
            <option value="events">
              🎉 Баярын арга хэмжээ
            </option>

            <option value="awards">
              🏆 Медаль, шагнал, тэмцээн
            </option>

            <option value="travel">
              🚌 Аялал
            </option>

            <option value="free">
              📸 Чөлөөт зургууд
            </option>
          </select>
        </div>


        <div class="form-group">
          <label for="title">
            Зургийн тайлбар
          </label>

          <input
            type="text"
            id="title"
            maxlength="100"
            placeholder="Жишээ: Багш нарын баяр 2026"
          >
        </div>


        <div class="form-group">

          <label>
            Зураг сонгох
          </label>

          <label
            for="photos"
            class="upload-box"
            id="uploadBox"
          >

            <div class="upload-icon">
              📷
            </div>

            <strong>
              Зургаа сонгох
            </strong>

            <span>
              Утас болон компьютерээс олон зураг зэрэг сонгож болно
            </span>

            <input
              type="file"
              id="photos"
              accept="image/*"
              multiple
              required
            >

          </label>

          <div
            class="selected-files"
            id="selectedFiles"
          >
            Зураг сонгоогүй байна.
          </div>

        </div>


        <label class="checkbox-row">

          <input
            type="checkbox"
            id="wide"
          >

          <span>
            🖼 Эдгээр зургийг том бүтэн өргөнөөр харуулах
          </span>

        </label>


        <button
          type="submit"
          class="upload-btn"
          id="uploadBtn"
        >
          ☁️ Зураг upload хийх
        </button>


        <div
          id="uploadStatus"
          class="status"
        ></div>

      </form>

    </section>


    <section class="admin-card">

      <div class="card-heading">

        <span>02</span>

        <div>
          <p>ЦОМГИЙН УДИРДЛАГА</p>
          <h2>Оруулсан зургууд</h2>
        </div>

      </div>


      <div class="filter-row">

        <select id="filterCategory">

          <option value="">
            Бүх зураг
          </option>

          <option value="events">
            🎉 Баярын арга хэмжээ
          </option>

          <option value="awards">
            🏆 Медаль, шагнал
          </option>

          <option value="travel">
            🚌 Аялал
          </option>

          <option value="free">
            📸 Чөлөөт зургууд
          </option>

        </select>


        <button
          type="button"
          id="refreshBtn"
          class="refresh-btn"
        >
          ↻ Шинэчлэх
        </button>

      </div>


      <div
        id="photoList"
        class="photo-list"
      >

        <div class="loading">
          Зургуудыг ачаалж байна...
        </div>

      </div>

    </section>

  </main>


  <div
    class="image-modal"
    id="imageModal"
  >

    <button id="closeModal">
      ×
    </button>

    <img
      id="modalImage"
      src=""
      alt="Зураг"
    >

  </div>


  <script src="admin.js"></script>

</body>
</html>
